[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ohnoo"
version = "0.1.0"
description = "A terminal companion that catches your crash, roasts it in one funny line, and fixes it for you."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ohnoo contributors" }]
requires-python = ">=3.9"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
share = ["Pillow>=10.0"]
mcp = ["mcp>=1.0"]
llm = ["httpx>=0.27", "tomli>=2.0; python_version<'3.11'"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Aashutosh-Mahajan/ohnoo"
Issues = "https://github.com/Aashutosh-Mahajan/ohnoo/issues"

[project.scripts]
ohnoo = "ohnoo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ohnoo"]

[tool.hatch.build.targets.wheel.force-include]
"src/ohnoo/patterns" = "ohnoo/patterns"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
